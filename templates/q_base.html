<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D7377">
<title>{% block title %}Workbench Quotes{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --teal-900:#0A5A5D; --teal-700:#0D7377; --teal-100:#E0F0F0;
  --orange:#E8541C; --amber:#F5A623;
  --cream:#FAF7F0; --paper:#F5F0E6;
  --ink:#1A1A1A; --ink-700:#3A3A3A; --ink-500:#6B6B6B;
  --line:#E8E2D4; --line-strong:#C9C2B0;
  --display:'Bricolage Grotesque',Georgia,serif;
  --body:'Manrope',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --green:#1E8449; --red:#C0392B;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{font-family:var(--body);font-size:16px;line-height:1.55;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;}
a{color:var(--teal-700);text-decoration:none;}
a:hover{text-decoration:underline;}
img{max-width:100%;display:block;}
button,input,textarea,select{font:inherit;}
::selection{background:var(--teal-700);color:var(--cream);}

.wrap{max-width:760px;margin:0 auto;padding:24px;}
.wrap-wide{max-width:1100px;margin:0 auto;padding:24px;}

/* HEADER */
.app-header{padding:14px 0;border-bottom:1px solid var(--line);background:var(--cream);position:sticky;top:0;z-index:50;}
.app-header .wrap-wide{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:0;padding-bottom:0;}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-0.02em;color:var(--ink);min-width:0;}
.brand .slash{color:var(--orange);font-family:var(--mono);font-weight:500;font-size:16px;flex-shrink:0;}
.brand .wordmark{white-space:nowrap;}
.brand .product{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-500);letter-spacing:0.02em;text-transform:uppercase;align-self:center;padding:3px 7px;background:var(--paper);border-radius:4px;flex-shrink:0;}
.app-header .nav{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;min-width:0;}
.app-header .nav a{color:var(--ink-500);white-space:nowrap;}
.app-header .nav .me{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
@media (max-width:540px){
  .brand{font-size:18px;}
  .brand .product{display:none;}
  .app-header .nav .me{display:none;}
}

/* HEADINGS */
h1{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.05;letter-spacing:-0.03em;margin:24px 0 8px;}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-0.02em;margin:32px 0 12px;}
h3{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-0.01em;margin:24px 0 8px;}
.lede{font-size:18px;color:var(--ink-700);margin-bottom:24px;}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--teal-700);display:inline-flex;align-items:center;gap:8px;margin-top:16px;}
.eyebrow::before{content:"//";color:var(--orange);font-weight:500;}

/* CARDS */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 1px 2px rgba(20,30,30,0.04);}
.card+.card{margin-top:16px;}
.card-paper{background:var(--paper);}
.card-teal{background:var(--teal-700);color:var(--cream);}
.card-teal h2,.card-teal h3{color:var(--cream);}

/* FORMS */
label{display:block;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-700);margin-bottom:8px;}
.hint{font-family:var(--body);font-size:13px;color:var(--ink-500);font-weight:400;text-transform:none;letter-spacing:normal;margin-top:-2px;margin-bottom:8px;font-style:italic;}
input[type=text],input[type=tel],input[type=email],input[type=number],textarea,select{width:100%;padding:12px 14px;font-family:var(--body);font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:6px;outline:none;transition:border-color 160ms;}
input:focus,textarea:focus,select:focus{border-color:var(--teal-700);box-shadow:0 0 0 3px rgba(13,115,119,0.12);}
textarea{min-height:120px;resize:vertical;}
.field{margin-bottom:20px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
@media (max-width:600px){.field-row{grid-template-columns:1fr;}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:6px;font-family:var(--body);font-weight:600;font-size:15px;text-decoration:none;transition:transform 100ms,background 160ms,color 160ms,border-color 160ms;min-height:48px;border:1px solid transparent;cursor:pointer;}
.btn:hover{text-decoration:none;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--teal-700);color:var(--cream);border-color:var(--teal-700);}
.btn-primary:hover{background:var(--teal-900);border-color:var(--teal-900);}
.btn-secondary{background:#fff;color:var(--teal-700);border-color:var(--teal-700);}
.btn-secondary:hover{background:var(--teal-100);}
.btn-orange{background:var(--orange);color:var(--cream);border-color:var(--orange);}
.btn-orange:hover{background:#c04812;border-color:#c04812;}
.btn-ghost{background:transparent;color:var(--ink-700);border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--paper);}
.btn-block{display:flex;width:100%;}
.btn-sm{padding:8px 14px;font-size:13px;min-height:36px;border-radius:4px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}

/* STATUS PILLS */
.pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:100px;}
.pill-draft{background:#f0f0f0;color:var(--ink-500);}
.pill-sent{background:#FFF0E0;color:var(--orange);}
.pill-viewed{background:#FFF8E0;color:#A07000;}
.pill-accepted{background:#DFF2E1;color:var(--green);}
.pill-declined{background:#F4D8D5;color:var(--red);}

/* TABLES */
.qtable{width:100%;border-collapse:collapse;margin-top:16px;}
.qtable th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-500);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);}
.qtable td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px;}
.qtable .num{text-align:right;font-family:var(--mono);}
.qtable tr:last-child td{border-bottom:none;}
.totals{margin-top:20px;border-top:2px solid var(--ink);padding-top:16px;}
.totals .row{display:flex;justify-content:space-between;padding:6px 0;font-family:var(--mono);}
.totals .row.total{font-family:var(--display);font-weight:700;font-size:24px;border-top:1px solid var(--line);margin-top:8px;padding-top:14px;}

/* FLASH MESSAGES */
.flash{padding:14px 18px;border-radius:6px;margin-bottom:20px;font-size:14px;}
.flash-info{background:var(--teal-100);color:var(--teal-900);border-left:3px solid var(--teal-700);}
.flash-error{background:#F4D8D5;color:var(--red);border-left:3px solid var(--red);}
.flash-success{background:#DFF2E1;color:var(--green);border-left:3px solid var(--green);}

/* DASHBOARD LIST */
.quote-list{display:grid;gap:12px;margin-top:16px;}
.quote-row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:6px;text-decoration:none;color:var(--ink);transition:border-color 160ms,transform 100ms;}
.quote-row:hover{border-color:var(--teal-700);text-decoration:none;transform:translateY(-1px);}
.quote-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.quote-row .who-name{font-size:16px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.quote-row .who-sub{font-size:13px;color:var(--ink-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quote-row .bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px;}
.quote-row .amount{font-family:var(--mono);font-weight:600;color:var(--ink);font-size:16px;}
.quote-row .meta{font-family:var(--mono);font-size:11px;color:var(--ink-500);}

.empty{text-align:center;padding:48px 20px;color:var(--ink-500);}
.empty h3{margin-top:0;color:var(--ink);}

.muted{color:var(--ink-500);}
.fine{font-family:var(--mono);font-size:12px;color:var(--ink-500);margin-top:24px;}
</style>
</head>
<body>

{% if user %}
<header class="app-header">
  <div class="wrap-wide">
    <a href="{{ url_for('q_dashboard') }}" class="brand">
      <span class="slash">//</span>
      <span class="wordmark">Workbench</span>
      <span class="product">Quotes</span>
    </a>
    <nav class="nav">
      <span class="me">{{ user.business_name }}</span>
      <a href="{{ url_for('q_logout') }}">Sign out</a>
    </nav>
  </div>
</header>
{% endif %}

<main class="wrap-wide">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash flash-{{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

</body>
</html>
